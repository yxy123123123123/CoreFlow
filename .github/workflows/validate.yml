name: Validate lightweight release

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify package scope and public evidence
        run: python tools/verify_package.py
      - name: Parse Python sources
        run: python tools/check_syntax.py
